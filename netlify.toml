[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Asset rule must come first so missing /assets/* files return a real 404
# instead of being caught by the SPA fallback (which would serve index.html
# as text/html for a missing JS chunk and trigger a MIME-type crash).
[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed build output never changes under the same name: let browsers keep it
# for a year without revalidating. Entry points (HTML, SW, manifest) must
# always be revalidated so a new deploy is picked up on the next launch.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"

# Functions import the shared ingredient parser from src/lib; esbuild follows
# relative imports outside the functions directory.
[functions]
  node_bundler = "esbuild"
